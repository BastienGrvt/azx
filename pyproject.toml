[project]
name = "alphaxero"
version = "0.1.0"
description = "A JAX/Equinox AlphaZero trainer built on mctx (MCTS) and the pgx environment standard."
authors = [{ name = "Bastien Grivet", email = "73183679+BastienGrvt@users.noreply.github.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
keywords = ["alphazero", "muzero", "mcts", "reinforcement-learning", "jax", "equinox", "mctx", "pgx"]
dependencies = [
    "equinox>=0.13.8",
    "jax[cuda13]",
    "matplotlib>=3.10.9",
    "mctx",
    "optax>=0.2.8",
    "pgx",
    "rich>=14.3.4",
]

[project.urls]
Homepage = "https://github.com/BastienGrvt/alphaxero"
Issues = "https://github.com/BastienGrvt/alphaxero/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaxero"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
