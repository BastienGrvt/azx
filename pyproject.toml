[project]
name = "alphaxero"
version = "0.1.0"
description = "Implementation of a mctx-based AlphaZero trainer with pgx standard."
authors = [{ name = "Bastien Grivet", email = "73183679+BastienGrvt@users.noreply.github.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "equinox>=0.13.8",
    "jax[cuda13]",
    "matplotlib>=3.10.9",
    "mctx",
    "optax>=0.2.8",
    "pgx",
    "pytest>=9.1.1",
    "rich>=14.3.4",
]


[project.urls]
Homepage = "https://github.com/BastienGrvt/alphaxero"
Issues = "https://github.com/BastienGrvt/alphaxero/issues"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = [ "src/alphazero" ]


